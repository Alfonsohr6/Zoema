<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoema | Catálogo Arequipa</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <div class="brand-container">
                <img src="../assets/images/oficiales/logozoema.jpg" alt="Logotipo Zoema" class="header-logo">
                <h1 class="logo">Zoema Arequipa</h1>
            </div>
            <nav class="navigation">
                <ul>
                    <li><a href="#inicio" class="active">Inicio</a></li>
                    <li><a href="#propiedades">Propiedades</a></li>
                    <li><a href="#remates">Remates</a></li>
                    <li><a href="#contacto">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="content-area">
        <section class="properties-section" id="propiedades">
            <h2>Catálogo Inmobiliario Arequipa</h2>
            <p class="section-subtitle">Explora nuestras opciones disponibles</p>
            
            <div class="filter-container">
                <button class="filter-btn active" data-filter="todos">Todos</button>
                <button class="filter-btn" data-filter-group="operacion" data-filter="venta">En Venta</button>
                <button class="filter-btn" data-filter-group="operacion" data-filter="alquiler">En Alquiler</button>
                <button class="filter-btn" data-filter-group="inmueble" data-filter="casa">Casas</button>
                <button class="filter-btn" data-filter-group="inmueble" data-filter="terreno">Terrenos</button>
                <button class="filter-btn" data-filter-group="inmueble" data-filter="departamento">Departamentos</button>
            </div>

            <div class="properties-grid" id="properties-container">
                <!-- Se inyectan las tarjetas por JS -->
            </div>
        </section>
    </main>

    <!-- Modal de Detalles -->
    <div id="modal-detalles" class="property-modal" aria-hidden="true">
        <div class="modal-container">
            <button type="button" class="close-modal-btn" id="closeModalBtn">&times;</button>
            <div class="modal-body">
                <h3 id="modal-title" class="modal-property-title">Título</h3>
                <p id="modal-price" class="modal-property-price">S/ 0.00</p>
                
                <div class="modal-specs-grid">
                    <div class="spec-item"><strong>📐 Área Total:</strong> <span id="modalArea">-</span></div>
                    <div class="spec-item"><strong>🏗️ Construcción:</strong> <span id="modalConstruction">-</span></div>
                </div>

                <div class="modal-environment-box">
                    <h4>📍 Ubicación:</h4>
                    <p id="modalLocationInfo">-</p>
                </div>

                <div class="modal-action-container"></div>
                <a href="#" target="_blank" id="modal-video-btn" class="card-btn modal-video-btn">🎬 Ver Video</a>
            </div>
        </div>
    </div>

    <!-- Scripts en orden estricto de dependencia -->
    <script src="config.js"></script>
    <script src="../assets/js/catalog-engine.js"></script>
    <script src="../assets/js/ui-interactions.js"></script>
</body>
</html>
